<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <meta name="robots" content="noindex,nofollow">
  <title>PP Fleet System | Manutenção</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#08111f;
      --panel:#101d2c;
      --line:#26384b;
      --text:#edf5fb;
      --muted:#9aabbb;
      --accent:#50d6c9;
      --warning:#e6b957;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(circle at 50% 0%,#123047 0,transparent 44%),
        linear-gradient(145deg,#07101b,#0b1724 55%,#08111f);
      color:var(--text);
      font-family:Inter,"Segoe UI",Arial,sans-serif;
    }
    .maintenance-card{
      width:min(680px,100%);
      padding:42px;
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(145deg,#122234e8,#0d1927f2);
      box-shadow:0 25px 80px #0008;
      text-align:center;
      backdrop-filter:blur(14px);
    }
    .brand{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      margin-bottom:30px;
      font-size:.82rem;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .brand-mark{
      width:42px;
      height:42px;
      display:grid;
      place-items:center;
      border:1px solid #50d6c966;
      border-radius:13px;
      background:#50d6c913;
      color:var(--accent);
      font-size:1.3rem;
    }
    .icon{
      width:94px;
      height:94px;
      display:grid;
      place-items:center;
      margin:0 auto 25px;
      border:1px solid #e6b95766;
      border-radius:50%;
      background:#e6b95716;
      color:var(--warning);
      font-size:2.7rem;
      box-shadow:0 0 0 12px #e6b95708;
    }
    h1{margin:0 0 14px;font-size:clamp(2rem,6vw,3.25rem);line-height:1.05}
    .message{max-width:520px;margin:0 auto;color:var(--muted);font-size:1.02rem;line-height:1.65}
    .status{
      display:inline-flex;
      align-items:center;
      gap:9px;
      margin-top:26px;
      padding:10px 15px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#08111f99;
      color:#c8d4df;
      font-size:.78rem;
      font-weight:750;
    }
    .pulse{
      width:9px;
      height:9px;
      border-radius:50%;
      background:var(--warning);
      box-shadow:0 0 0 0 #e6b95770;
      animation:pulse 1.9s infinite;
    }
    footer{margin-top:32px;color:#718397;font-size:.7rem}
    @keyframes pulse{70%{box-shadow:0 0 0 10px #e6b95700}100%{box-shadow:0 0 0 0 #e6b95700}}
    @media(max-width:560px){.maintenance-card{padding:32px 22px}.brand{margin-bottom:24px}}
  </style>
</head>
<body>
  <main class="maintenance-card" role="main" aria-labelledby="maintenance-title">
    <div class="brand"><span class="brand-mark">▣</span><span>PP Fleet System</span></div>
    <div class="icon" aria-hidden="true">⚙</div>
    <h1 id="maintenance-title">Plataforma em manutenção</h1>
    <p class="message">Estamos realizando melhorias no sistema. Durante este período, as funções do PP Fleet ficam temporariamente indisponíveis para evitar alterações nos dados.</p>
    <div class="status"><span class="pulse" aria-hidden="true"></span>Voltamos logo</div>
    <footer>PP Fleet System · Gestão de Frota</footer>
  </main>
</body>
</html>
